<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <h2>CadastroOOOOOOOOOOOOOO</h2>

    <form>

        <label for="nome">Nomizin:</label><br>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <br><br>

        <label for="senha">Senhão:</label><br>
        <input type="password" id="senha" placeholder="Digite sua senha">
        <br><br>

        <label for="email">E-mail dos guardiões:</label><br>
        <input type="email" id="email" placeholder="exemplo@gmail.com">
        <br><br>

        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" min="0" max="20"> 
        <br><br>

        <label for="data">Data de nascimento:</label><br>
        <input type="date" id="data">
        <br><br>

        <label for="nota">Nota (3 a 10):</label><br>
        <input type="number" id="nota" min="3" max="10">
        <br><br>

        <p>Hobbies:</p>

        <input type="checkbox" id="jogos" name="hobby">
        <label for="jogos">Jogos</label><br>

        <input type="checkbox" id="musica" name="hobby">
        <label for="musica">Música</label><br>

        <input type="checkbox" id="esportes" name="hobby">
        <label for="esportes">Esportes</label>

        <br><br>

        <p>Plano:</p>

        <input type="radio" id="gratuito" name="plano">
        <label for="gratuito">Gratuito</label><br>

        <input type="radio" id="pago" name="plano">
        <label for="pago">Pago</label>

        <br><br>

        <label for="cidade">Cidade:</label><br>
        <select id="cidade" name="cidade">
            <option value="londrina">Londrina</option>
            <option value="cambe">Cambé</option>
        </select>

        <br><br>

        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">

    </form>

</body>
</html>
